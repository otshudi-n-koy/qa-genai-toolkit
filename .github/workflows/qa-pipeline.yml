name: QA GenAI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  generate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate tests from User Story
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_URL: http://localhost:3000
        run: |
          npm run generate examples/user-stories/US_001_create_task.md -- --type both

      - name: Verify generated tests compile
        run: npx tsc --noEmit --project tsconfig.json
        continue-on-error: true

      - name: Check test structure
        run: |
          echo "📋 Generated test files:"
          find examples/generated-tests -name "*.spec.ts" | head -20
          echo ""
          echo "📊 Test count:"
          grep -r "test(" examples/generated-tests --include="*.spec.ts" | wc -l || true

      - name: Upload generated tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-tests
          path: examples/generated-tests/
          retention-days: 30